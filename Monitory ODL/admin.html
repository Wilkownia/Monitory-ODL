<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel sterowania</title>
<link id="appFavicon" rel="icon" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="adminWindow">
<div id="adminOverlay">
<div id="adminPanel">
<div class="adminHeader"><h2>⚙ Panel sterowania</h2><button class="closeButton" id="closeAdminButton">×</button></div>
<div id="adminBody">
<section class="section"><h3><span class="panelIcon">🖥</span>Wygląd ekranu</h3>
<div class="grid">
<div class="field"><label>Wielkość tekstu paska [px]</label><input id="tickerSize" type="number" min="12" max="100"></div>
<div class="field"><label>Szybkość przewijania [px/s]</label><input id="tickerSpeed" type="number" min="5" max="300"></div>
<div class="screenTextFields full">
<div class="field sideInfoAdminField"><label>Informacje w kafelku bocznym</label><div id="sideInfoLimitHint" class="fieldLimitHint">Znaki: 0/360</div><textarea id="sideInfoInput" rows="15" maxlength="360" placeholder="Wpisz informacje..."></textarea></div>
<div class="field tickerAdminField"><label>Tekst domyślnego paska</label><div id="tickerLimitHint" class="fieldLimitHint">Znaki: 0/1500</div><textarea id="tickerInput" maxlength="1500" placeholder="Wpisz tekst..."></textarea></div>
</div>
<div class="field"><label><input id="showClock" type="checkbox"> Pokaż zegar</label></div>
</div><br><button class="btnPrimary" id="saveScreenSettingsButton">ZAPISZ USTAWIENIA EKRANU</button></section>

<section class="section"><h3><span class="panelIcon">🖼</span>Zdjęcia</h3>
<div class="grid2"><div class="field"><label>Dodaj zdjęcia</label><input id="imagePicker" type="file" accept="image/*" multiple></div><div class="field"><label>Domyślny czas zdjęcia [sek.]</label><input id="defaultImageTime" type="number" min="1" max="3600" value="5"></div></div><br><div id="imageList" class="mediaList"></div></section>

<section class="section"><h3><span class="panelIcon">🌐</span>Strony WWW</h3>
<div class="grid">
<div class="field full"><label>Adres strony WWW</label><input id="urlInput" type="text" placeholder="https://..."></div>
<div class="field"><label>Czas wyświetlania [min.]</label><input id="urlDurationInput" type="number" min="1" max="1440" value="30"></div>
<div class="field"><label>Przerwa / interwał [min.]</label><input id="urlIntervalInput" type="number" min="1" max="1440" value="60"></div>
<div class="field full"><label>Sposób wyświetlania</label><div class="urlModeOptions"><label class="urlModeOption"><input type="radio" name="urlDisplayMode" value="always" checked><span>Cały czas</span></label><label class="urlModeOption"><input type="radio" name="urlDisplayMode" value="scheduled"><span>Harmonogram</span></label></div></div>
<div id="urlScheduleField" class="field full"><label>Godziny wyświetlania</label><div id="urlScheduleWindows" class="scheduleWindows"><div class="urlTimeWindowRow"><input class="urlWindowFrom" type="time" value="13:00"><input class="urlWindowTo" type="time" value="16:00"><div class="days"><button type="button" class="dayButton active" data-day="1">Pn</button><button type="button" class="dayButton active" data-day="2">Wt</button><button type="button" class="dayButton active" data-day="3">Śr</button><button type="button" class="dayButton active" data-day="4">Czw</button><button type="button" class="dayButton active" data-day="5">Pt</button><button type="button" class="dayButton active" data-day="6">Sob</button><button type="button" class="dayButton active" data-day="0">Nd</button></div><button type="button" class="btnDanger removeUrlScheduleButton">×</button></div></div><button type="button" id="addUrlScheduleButton" class="btnSecondary">+ DODAJ GODZINY</button></div>
<div class="field full"><label><span class="toggleSwitch"><input id="urlRunOnStartInput" type="checkbox" checked> Uruchom od razu po starcie</span></label><label><span class="toggleSwitch"><input id="urlShowBarInput" type="checkbox" checked> Pokaż dolny pasek</span></label></div>
</div><br><button class="btnPrimary" id="addUrlButton">+ DODAJ STRONĘ WWW</button><br><br><div id="urlList" class="mediaList"></div></section>

<section id="messageEditor" class="section"><h3><span class="panelIcon">📢</span>Dodaj / edytuj komunikat</h3><input id="editingMessageId" type="hidden"><div class="grid">
<div class="field"><label>Tytuł</label><input id="messageTitle" type="text"></div><div class="field"><label>Typ</label><select id="messageType"><option value="info">Informacja</option><option value="warning">Ostrzeżenie</option><option value="danger">Pilne</option><option value="success">Pozytywna</option></select></div>
<div class="field full"><label>Treść</label><textarea id="messageDescription"></textarea></div><div class="field full"><label>Zdjęcie komunikatu</label><input id="messageImagePicker" type="file" accept="image/*"><img id="messageImagePreview" alt=""><button type="button" id="removeMessageImageButton" class="btnDanger">USUŃ ZDJĘCIE</button></div>
<div class="field"><label>Data od</label><input id="messageDateFrom" type="date"></div><div class="field"><label>Data do</label><input id="messageDateTo" type="date"></div><div class="field"><label>Godzina od</label><input id="messageTimeFrom" type="time" value="00:00"></div><div class="field"><label>Godzina do</label><input id="messageTimeTo" type="time" value="23:59"></div>
<div class="field full"><label>Dni tygodnia</label><div id="messageDays" class="days"><button type="button" class="dayButton active" data-day="1">PON</button><button type="button" class="dayButton active" data-day="2">WT</button><button type="button" class="dayButton active" data-day="3">ŚR</button><button type="button" class="dayButton active" data-day="4">CZW</button><button type="button" class="dayButton active" data-day="5">PT</button><button type="button" class="dayButton active" data-day="6">SOB</button><button type="button" class="dayButton active" data-day="0">ND</button></div></div>
<div class="field"><label><input id="messageActive" type="checkbox" checked> Aktywny</label></div><div class="field"><label><input id="messageFullscreen" type="checkbox"> Komunikat pełnoekranowy</label></div><div id="messageShowBarField" class="field" hidden><label><input id="messageShowBar" type="checkbox"> Pokaż dolny pasek</label></div>
</div><br><div class="buttons"><button class="btnPrimary" id="saveMessageButton">ZAPISZ KOMUNIKAT</button><button class="btnSecondary" id="clearMessageButton">WYCZYŚĆ</button></div></section>

<section class="section"><h3><span class="panelIcon">📋</span>Komunikaty</h3><div id="messageList"></div></section>
<section class="section"><h3><span class="panelIcon">⚙</span>Ustawienia systemu</h3><div class="grid"><div class="field"><label>PIN panelu</label><input id="newPin" type="password" maxlength="10" placeholder="Pozostaw puste bez zmiany"></div><div class="field"><label><input id="requirePin" type="checkbox" checked> Wymagaj PIN-u</label></div></div><br><button class="btnPrimary" id="saveSystemSettingsButton">ZAPISZ</button></section>
</div></div></div>
<div id="pinOverlay"><div id="pinBox"><h2>Panel administracyjny</h2><p>Wprowadź PIN</p><input id="pinInput" type="password" maxlength="10" autocomplete="off"><div class="buttons"><button class="btnPrimary" id="checkPinButton">OK</button><button class="btnSecondary" id="closePinButton">ANULUJ</button></div></div></div>
<div id="toast"></div>
<script src="js/storage.js"></script><script src="js/config.js"></script><script src="js/clock.js"></script><script src="js/scheduler.js"></script><script src="js/ticker.js"></script><script src="js/display.js"></script><script src="js/playlist.js"></script><script src="js/iframe.js"></script><script src="js/sync.js"></script><script src="js/images.js"></script><script src="js/urls.js"></script><script src="js/message-form.js"></script><script src="js/message-storage.js"></script><script src="js/message-schedule.js"></script><script src="js/message-display.js"></script><script src="js/message-list.js"></script><script src="js/admin.js"></script><script src="js/app.js"></script>
</body>
</html>
