<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitory ODL</title>
<link id="appFavicon" rel="icon" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="screen">
    <aside id="sideInfoPanel">
        <div class="sidePanelTile sidePanelLogoTile"><div class="sideInfoTitle">ODLEWNIA W14</div></div>
        <div class="sidePanelTile sidePanelClockTile"><div id="clockBox">00:00</div></div>
        <div class="sidePanelTile"><div id="sideInfoDate"><div id="welcomeWeekday">SOBOTA</div><div id="welcomeDateNumber">22 SIERPNIA</div><div id="welcomeYear">2026</div></div></div>
        <div class="sidePanelTile sidePanelInfoTile"><span id="sideInfoText"></span></div>
    </aside>
    <div id="mainZone">
        <div id="contentFrame" class="layoutTile"><img id="imageDisplay" class="media" alt=""></div>
        <iframe id="iframeDisplay" class="media" title="Strona WWW"></iframe>
    </div>
    <div id="fullScreenMessage"><img id="fullScreenMessageImage" alt=""><div id="fullScreenMessageText"></div></div>
    <div id="bottomBar" class="layoutTile"><div id="tickerBox"><div id="tickerText"></div></div></div>
</div>
<div id="toast"></div>
<script src="js/storage.js"></script>
<script src="js/config.js"></script>
<script src="js/clock.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/ticker.js"></script>
<script src="js/display.js"></script>
<script src="js/playlist.js"></script>
<script src="js/iframe.js"></script>
<script src="js/sync.js"></script>
<script src="js/images.js"></script>
<script src="js/urls.js"></script>
<script src="js/message-form.js"></script>
<script src="js/message-storage.js"></script>
<script src="js/message-schedule.js"></script>
<script src="js/message-display.js"></script>
<script src="js/message-list.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
